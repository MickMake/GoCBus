name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        if: ${{ hashFiles('go.mod') != '' }}
        run: go vet ./...
      - name: Test
        if: ${{ hashFiles('go.mod') != '' }}
        run: go test ./...
      - name: Build
        if: ${{ hashFiles('go.mod') != '' }}
        run: go build ./...
